<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Block Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f4efe6;
    --dim: rgba(244, 239, 230, 0.6);
    --accent: #e8a33a;
    --danger: #e0412f;
    --glass: rgba(14, 12, 10, 0.55);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; overflow: hidden; background: #0b0a09; }

  body {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    color: var(--ink);
    user-select: none;
  }

  /* ---------- Background slideshow ---------- */
  .bg {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transform: scale(1.0);
    transition: opacity 1.6s ease-in-out;
  }
  .bg.show {
    opacity: 1;
    animation: drift 12s linear forwards;
  }
  @keyframes drift {
    from { transform: scale(1.0); }
    to   { transform: scale(1.08); }
  }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%),
      linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 35%);
  }

  /* ---------- Timer ---------- */
  main {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.6rem;
    padding: 2rem;
  }

  .modes {
    display: flex;
    background: var(--glass);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    padding: 4px;
  }
  .modes button {
    font: 600 1rem/1 "Barlow Condensed", sans-serif;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--dim);
    background: none;
    border: 0;
    padding: 0.55rem 1.3rem;
    border-radius: 999px;
    cursor: pointer;
  }
  .modes button.active { background: var(--ink); color: #111; }

  .clock {
    font-family: "Bebas Neue", Impact, sans-serif;
    font-size: clamp(5rem, 19vw, 16rem);
    line-height: 0.9;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 4px 30px rgba(0,0,0,0.7);
    display: flex;
    align-items: baseline;
  }
  .clock .sep { opacity: 0.7; padding: 0 0.04em; }
  .clock .frac { font-size: 0.35em; opacity: 0.75; margin-left: 0.1em; }
  .clock.editable .unit {
    cursor: ns-resize;
    border-bottom: 3px dashed rgba(255,255,255,0.25);
  }
  .clock.editable .unit:hover { color: var(--accent); border-color: var(--accent); }
  .clock.done { color: var(--danger); animation: flash 0.5s steps(2) infinite; }
  @keyframes flash { 50% { opacity: 0.35; } }

  .hint {
    font-size: 0.95rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
    margin-top: -0.8rem;
    min-height: 1.2em;
    text-shadow: 0 1px 8px rgba(0,0,0,0.9);
  }

  .progress {
    width: min(640px, 80vw);
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress div {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.25s linear;
  }

  .presets, .controls { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; }

  .presets button {
    font: 600 1rem/1 "Barlow Condensed", sans-serif;
    letter-spacing: 0.1em;
    color: var(--ink);
    background: var(--glass);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 0.5rem 0.95rem;
    border-radius: 6px;
    cursor: pointer;
  }
  .presets button:hover { border-color: var(--accent); color: var(--accent); }

  .controls button {
    font: 400 1.6rem/1 "Bebas Neue", Impact, sans-serif;
    letter-spacing: 0.12em;
    min-width: 9rem;
    padding: 0.85rem 1.6rem 0.7rem;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--ink);
    background: var(--glass);
    backdrop-filter: blur(8px);
  }
  .controls button.primary { background: var(--accent); border-color: var(--accent); color: #1a1208; }
  .controls button.primary.running { background: var(--ink); border-color: var(--ink); }
  .controls button:hover { filter: brightness(1.12); }

  [hidden] { display: none !important; }

  /* ---------- Caption + dots ---------- */
  .caption {
    position: fixed;
    left: clamp(1.2rem, 4vw, 3rem);
    bottom: clamp(1.2rem, 4vh, 2.6rem);
    z-index: 2;
    max-width: 70vw;
  }
  .caption .year {
    font: 600 1rem/1 "Barlow Condensed", sans-serif;
    letter-spacing: 0.3em;
    color: var(--accent);
  }
  .caption h2 {
    font: 400 clamp(1.8rem, 4vw, 3rem)/1 "Bebas Neue", Impact, sans-serif;
    letter-spacing: 0.04em;
    margin: 0.3rem 0 0.25rem;
    text-shadow: 0 2px 16px rgba(0,0,0,0.8);
  }
  .caption p {
    font-size: 1.05rem;
    letter-spacing: 0.08em;
    color: var(--dim);
    text-shadow: 0 1px 8px rgba(0,0,0,0.9);
  }
  .caption > * { transition: opacity 0.6s, transform 0.6s; }
  .caption.swap > * { opacity: 0; transform: translateY(8px); }

  .dots {
    display: flex;
    gap: 8px;
    margin-top: 0.9rem;
  }
  .dots button {
    width: 28px;
    height: 4px;
    border: 0;
    border-radius: 2px;
    background: rgba(255,255,255,0.25);
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .dots button.active::after {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--ink);
    transform-origin: left;
    animation: fill var(--slide-ms) linear forwards;
  }
  @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  .credit {
    position: fixed;
    right: 1rem;
    bottom: 0.8rem;
    z-index: 2;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    color: rgba(244,239,230,0.45);
    max-width: 45vw;
    text-align: right;
  }
  .credit a { color: inherit; }

  @media (max-width: 640px) {
    .caption { max-width: 90vw; bottom: 3.2rem; }
    .credit { left: 1rem; max-width: none; text-align: left; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bg.show { animation: none; }
  }
</style>
</head>
<body>

<div class="bg" id="bgA"></div>
<div class="bg" id="bgB"></div>
<div class="vignette"></div>

<main>
  <div class="modes" role="tablist">
    <button class="active" data-mode="timer">Timer</button>
    <button data-mode="stopwatch">Stopwatch</button>
  </div>

  <div class="clock editable" id="clock" aria-live="off">
    <span class="unit" data-unit="h" id="hh">00</span><span class="sep">:</span>
    <span class="unit" data-unit="m" id="mm">05</span><span class="sep">:</span>
    <span class="unit" data-unit="s" id="ss">00</span>
    <span class="frac" id="frac" hidden>.0</span>
  </div>
  <div class="hint" id="hint">Scroll or use arrow keys on a number to set it</div>

  <div class="progress" id="progressWrap"><div id="progress"></div></div>

  <div class="presets" id="presets">
    <button data-sec="60">1 min</button>
    <button data-sec="180">3 min</button>
    <button data-sec="300">5 min</button>
    <button data-sec="600">10 min</button>
    <button data-sec="1500">25 min</button>
    <button data-sec="3600">1 hr</button>
  </div>

  <div class="controls">
    <button class="primary" id="startBtn">Start</button>
    <button id="resetBtn">Reset</button>
  </div>
</main>

<div class="caption" id="caption">
  <div class="year" id="capYear"></div>
  <h2 id="capName"></h2>
  <p id="capSpec"></p>
  <div class="dots" id="dots"></div>
</div>

<div class="credit" id="credit"></div>

<script>
/* ===================== Background slideshow ===================== */
const SLIDE_MS = 10000;

const SLIDES = [
  {
    img: "images/elcamino.jpg",
    year: "1970",
    name: "Chevrolet El Camino SS 454 LS6",
    spec: "454 cu in big-block V8 · 450 hp · the hauler with a Chevelle heart",
    credit: "Hugh Llewelyn",
    license: "CC BY-SA 2.0",
    source: "https://commons.wikimedia.org/wiki/File:1970_Chevrolet_El_Camino_SS_396_Pick-up_(34397840334).jpg",
  },
  {
    img: "images/camaro.jpg",
    year: "1968",
    name: "Chevrolet Camaro RS/SS 396",
    spec: "396 cu in big-block V8 · hidden headlights · up to 375 hp",
    credit: "GPS 56",
    license: "CC BY 2.0",
    source: "https://commons.wikimedia.org/wiki/File:1968_Chevrolet_Camaro_RS-SS_(18651452618).jpg",
  },
  {
    img: "images/corvette.jpg",
    year: "1963",
    name: "Corvette Sting Ray Split Window Z06 “Big Tank”",
    spec: "327 fuel-injected V8 · 360 hp · 36.5-gallon endurance tank",
    credit: "Thesupermat",
    license: "CC BY-SA 4.0",
    source: "https://commons.wikimedia.org/wiki/File:Paris_-_RM_Sotheby%E2%80%99s_2018_-_Chevrolet_Corvette_sting_ray_split_window_coup%C3%A9_-_1963_-_003.jpg",
  },
  {
    img: "images/b17.jpg",
    year: "WWII",
    name: "Boeing B-17 Flying Fortress",
    spec: "4 × Wright R-1820 Cyclone radials · 13 × .50 cal · heavy bomber",
    credit: "Julian Herzog",
    license: "CC BY 4.0",
    source: "https://commons.wikimedia.org/wiki/File:Boeing_B-17G_Flying_Fortress_124485_DF-A_Duxford_Flying_Evening_2024_02.jpg",
  },
  {
    img: "images/p38.jpg",
    year: "WWII",
    name: "Lockheed P-38 Lightning",
    spec: "2 × Allison V-1710 · twin-boom fighter · “fork-tailed devil”",
    credit: "U.S. Air Force",
    license: "Public domain",
    source: "https://commons.wikimedia.org/wiki/File:Lockheed_P-38J_Lightning_in_flight_over_California,_circa_in_1944.jpg",
  },
];

const layers = [document.getElementById("bgA"), document.getElementById("bgB")];
const caption = document.getElementById("caption");
const capYear = document.getElementById("capYear");
const capName = document.getElementById("capName");
const capSpec = document.getElementById("capSpec");
const credit = document.getElementById("credit");
const dotsEl = document.getElementById("dots");

document.documentElement.style.setProperty("--slide-ms", SLIDE_MS + "ms");

// Preload so crossfades never flash an empty frame
SLIDES.forEach(s => { const i = new Image(); i.src = s.img; });

SLIDES.forEach((s, i) => {
  const b = document.createElement("button");
  b.title = s.year + " " + s.name;
  b.addEventListener("click", () => { showSlide(i); restartSlideTimer(); });
  dotsEl.appendChild(b);
});

let slideIndex = -1;
let activeLayer = 0;
let slideTimer = null;

function showSlide(i) {
  if (i === slideIndex) return;
  slideIndex = i;
  const s = SLIDES[i];

  const next = layers[1 - activeLayer];
  const prev = layers[activeLayer];
  next.style.backgroundImage = `url("${s.img}")`;
  // Restart the drift animation on the incoming layer
  next.classList.remove("show");
  void next.offsetWidth;
  next.classList.add("show");
  prev.classList.remove("show");
  activeLayer = 1 - activeLayer;

  caption.classList.add("swap");
  setTimeout(() => {
    capYear.textContent = s.year;
    capName.textContent = s.name;
    capSpec.textContent = s.spec;
    credit.innerHTML = `Photo: ${s.credit} · ${s.license} · <a href="${s.source}" target="_blank" rel="noopener">source</a>`;
    caption.classList.remove("swap");
  }, 400);

  [...dotsEl.children].forEach((d, j) => {
    d.classList.remove("active");
    if (j === i) { void d.offsetWidth; d.classList.add("active"); }
  });
}

function restartSlideTimer() {
  clearInterval(slideTimer);
  slideTimer = setInterval(() => showSlide((slideIndex + 1) % SLIDES.length), SLIDE_MS);
}

showSlide(0);
restartSlideTimer();

/* ===================== Timer / Stopwatch ===================== */
const clock = document.getElementById("clock");
const hh = document.getElementById("hh");
const mm = document.getElementById("mm");
const ss = document.getElementById("ss");
const frac = document.getElementById("frac");
const hint = document.getElementById("hint");
const progress = document.getElementById("progress");
const progressWrap = document.getElementById("progressWrap");
const presets = document.getElementById("presets");
const startBtn = document.getElementById("startBtn");
const resetBtn = document.getElementById("resetBtn");

let mode = "timer";
let setMs = 5 * 60 * 1000;   // timer duration chosen by the user
let elapsedMs = 0;           // time accumulated before the current run
let runStart = 0;            // performance.now() when the current run began
let running = false;
let finished = false;
let tick = null;            // interval keeps running in background tabs, unlike rAF

const pad = n => String(n).padStart(2, "0");

function currentElapsed() {
  return elapsedMs + (running ? performance.now() - runStart : 0);
}

function render() {
  const elapsed = currentElapsed();
  let shown = mode === "timer" ? Math.max(0, setMs - elapsed) : elapsed;

  // Timer rounds up so "00:00:01" shows until the last second actually ends
  const totalSec = mode === "timer" ? Math.ceil(shown / 1000) : Math.floor(shown / 1000);
  hh.textContent = pad(Math.floor(totalSec / 3600));
  mm.textContent = pad(Math.floor(totalSec / 60) % 60);
  ss.textContent = pad(totalSec % 60);
  frac.textContent = "." + Math.floor((shown % 1000) / 100);

  if (mode === "timer") {
    progress.style.width = setMs ? Math.min(100, (elapsed / setMs) * 100) + "%" : "0%";
    document.title = running || elapsed > 0
      ? `${mm.textContent}:${ss.textContent} · Big Block Timer`
      : "Big Block Timer";
    if (running && elapsed >= setMs) finish();
  } else {
    document.title = running ? `${hh.textContent}:${mm.textContent}:${ss.textContent} · Stopwatch` : "Big Block Timer";
  }
}

function updateUi() {
  const pristine = !running && currentElapsed() === 0;
  clock.classList.toggle("editable", mode === "timer" && pristine);
  clock.classList.toggle("done", finished);
  presets.hidden = mode !== "timer" || !pristine;
  progressWrap.hidden = mode !== "timer";
  frac.hidden = mode !== "stopwatch";
  hint.textContent = mode === "timer" && pristine
    ? "Scroll or use arrow keys on a number to set it · Space to start"
    : finished ? "Time's up · Space or Reset to clear"
    : "Space to " + (running ? "pause" : "resume") + " · R to reset";

  startBtn.textContent = running ? "Pause" : (currentElapsed() > 0 && !finished ? "Resume" : "Start");
  startBtn.classList.toggle("running", running);
}

function start() {
  if (finished) { reset(); return; }
  if (mode === "timer" && setMs === 0) return;
  running = true;
  runStart = performance.now();
  unlockAudio();
  clearInterval(tick);
  tick = setInterval(render, 100);
  render();
  updateUi();
}

function pause() {
  elapsedMs = currentElapsed();
  running = false;
  clearInterval(tick);
  render();
  updateUi();
}

function reset() {
  running = false;
  finished = false;
  elapsedMs = 0;
  clearInterval(tick);
  stopAlarm();
  render();
  updateUi();
}

function finish() {
  elapsedMs = setMs;
  running = false;
  finished = true;
  clearInterval(tick);
  render();
  updateUi();
  playAlarm();
}

function setDuration(ms) {
  setMs = Math.max(0, Math.min(ms, (99 * 3600 + 59 * 60 + 59) * 1000));
  render();
}

// Adjust hours / minutes / seconds by scrolling or arrow keys on each unit
const UNIT_MS = { h: 3600000, m: 60000, s: 1000 };

function nudge(unit, dir) {
  if (!clock.classList.contains("editable")) return;
  const step = UNIT_MS[unit] * (unit === "s" ? 5 : 1);
  setDuration(setMs + dir * step);
}

[hh, mm, ss].forEach(el => {
  el.tabIndex = 0;
  el.addEventListener("wheel", e => {
    e.preventDefault();
    nudge(el.dataset.unit, e.deltaY < 0 ? 1 : -1);
  }, { passive: false });
  el.addEventListener("keydown", e => {
    if (e.key === "ArrowUp")   { e.preventDefault(); nudge(el.dataset.unit, 1); }
    if (e.key === "ArrowDown") { e.preventDefault(); nudge(el.dataset.unit, -1); }
  });
});

presets.addEventListener("click", e => {
  const sec = e.target.dataset.sec;
  if (sec) setDuration(sec * 1000);
});

document.querySelectorAll(".modes button").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll(".modes button").forEach(x => x.classList.toggle("active", x === b));
    mode = b.dataset.mode;
    reset();
  });
});

startBtn.addEventListener("click", () => running ? pause() : start());
resetBtn.addEventListener("click", reset);

document.addEventListener("keydown", e => {
  if (e.target.tagName === "BUTTON" && (e.key === " " || e.key === "Enter")) return;
  if (e.key === " ") { e.preventDefault(); running ? pause() : start(); }
  if (e.key === "r" || e.key === "R") reset();
});

/* ===================== Alarm (no audio files needed) ===================== */
let audioCtx = null;
let alarmTimer = null;

function unlockAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
}

function beep(at, freq) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "square";
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, at);
  gain.gain.exponentialRampToValueAtTime(0.18, at + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.18);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(at);
  osc.stop(at + 0.2);
}

function playAlarm() {
  if (!audioCtx) return;
  let rounds = 0;
  const ring = () => {
    const t = audioCtx.currentTime;
    [0, 0.22, 0.44].forEach((d, i) => beep(t + d, i === 2 ? 1320 : 880));
    if (++rounds >= 8) stopAlarm();
  };
  ring();
  alarmTimer = setInterval(ring, 1200);
}

function stopAlarm() {
  clearInterval(alarmTimer);
  alarmTimer = null;
}

render();
updateUi();
</script>
</body>
</html>
